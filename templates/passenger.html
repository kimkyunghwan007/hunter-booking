<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>헌터호 온라인 승선명부</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;background:#eef3f7;color:#162437}
main{max-width:560px;margin:auto;padding:18px}.top{background:#0b2945;color:white;padding:22px 18px;border-radius:18px;margin-bottom:14px}.top h1{font-size:24px;margin:0 0 7px}.top p{margin:0;color:#d9e5ef;font-size:14px;line-height:1.6}
.card{background:white;border-radius:17px;padding:18px;box-shadow:0 5px 18px rgba(15,43,68,.08);border:1px solid #e7edf2}.flash{background:#fff3cd;border:1px solid #f1d675;padding:13px;border-radius:11px;margin-bottom:13px;font-weight:700}
label{display:block;font-weight:800;font-size:14px;margin:14px 0 6px}input{width:100%;padding:14px;border:1px solid #d5dde6;border-radius:11px;background:white;font-size:16px}.agree{display:flex;gap:9px;align-items:flex-start;margin-top:18px;font-weight:700;line-height:1.5}.agree input{width:22px;height:22px;margin-top:1px;flex:0 0 auto}.notice{margin-top:16px;padding:13px;background:#f5f8fa;border-radius:11px;color:#5d6b78;font-size:13px;line-height:1.65}.submit{width:100%;border:0;background:#0b2945;color:white;padding:15px;border-radius:11px;font-weight:900;font-size:17px;margin-top:18px}.foot{text-align:center;color:#7a8793;font-size:12px;padding:18px 0}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>⚓ 헌터호 온라인 승선명부</h1>
    <p>승선 전 아래 내용을 정확히 입력해주세요.<br>출항지 : 거북섬 마리나</p>
  </div>

  {% with messages = get_flashed_messages() %}
  {% if messages %}<div class="flash">{{messages[0]}}</div>{% endif %}
  {% endwith %}

  <form method="post" action="/passenger" class="card">
    <label>승선일</label>
    <input type="date" name="boarding_date" value="{{prefill_date or ''}}" required>

    <label>성명</label>
    <input type="text" name="name" maxlength="30" autocomplete="name" required>

    <label>생년월일</label>
    <input type="text" name="birth_date" inputmode="numeric" placeholder="예: 19800101" maxlength="8" required>

    <label>연락처</label>
    <input type="tel" name="phone" inputmode="numeric" placeholder="01012345678" maxlength="13" required>

    <label>비상연락처</label>
    <input type="tel" name="emergency_phone" inputmode="numeric" placeholder="01012345678" maxlength="13" required>

    <div class="notice">
      <b>안전수칙 확인</b><br>
      구명조끼 착용 및 선내 안전수칙 안내를 확인하였으며, 운항 중 선장의 안전지시에 따르겠습니다.<br><br>
      입력한 정보는 안전한 운항 및 비상 상황 확인을 위한 승선자 관리 목적으로 사용합니다.
    </div>

    <label class="agree">
      <input type="checkbox" name="agree" value="yes" required>
      <span>안전수칙 및 개인정보 수집·이용에 동의합니다. (필수)</span>
    </label>

    <button class="submit" type="submit">승선명부 제출하기</button>
  </form>
  <div class="foot">헌터호 · 거북섬 마리나</div>
</main>
</body>
</html>
