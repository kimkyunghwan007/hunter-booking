<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>승선명부 저장 완료</title>
<style>
body{margin:0;background:#0e131b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:600px;margin:auto;padding:35px 20px}.card{background:#fff;color:#172332;border-radius:22px;padding:30px 22px;text-align:center}
h1{font-size:25px;margin:0 0 15px}.ok{display:inline-block;background:#eaf5ef;color:#147044;border-radius:999px;padding:8px 13px;font-weight:900;margin-bottom:8px}
.count{font-size:22px;font-weight:900;color:#0b5f93}.info{background:#f3f6f8;border-radius:12px;padding:13px;margin:16px 0;line-height:1.6}
a{display:block;margin-top:22px;background:#0b2945;color:#fff;text-decoration:none;padding:14px;border-radius:12px;font-weight:900}
</style>
</head>
<body><main><div class="card">
<div class="ok">✅ 데이터베이스 저장 확인 완료</div>
<h1>승선명부 저장 완료</h1>
<p><b>{{name}}</b>님 대표로 정상 저장되었습니다.</p>
<p class="count">총 {{count}}명 저장</p>
<div class="info">승선일 <b>{{boarding_date}}</b>{% if booking %}<br>{{booking.program}} · 예약자 {{booking.name}} · 예약 {{booking.people}}명{% endif %}</div>
<p>이 화면이 보이면 저장이 끝난 상태입니다.</p>
<a href="/">헌터호 예약 홈페이지로</a>
</div></main></body></html>
