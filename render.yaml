services:
  - type: web
    name: hunter-booking
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hunter-db
          property: connectionString

databases:
  - name: hunter-db
    databaseName: hunter
    user: hunter
