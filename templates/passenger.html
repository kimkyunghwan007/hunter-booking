<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>헌터호 온라인 승선명부</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0e131b;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:720px;margin:auto;padding:18px}.hero{background:#00133d;border-radius:25px;padding:27px 22px;margin-bottom:16px}
.hero h1{font-size:27px;margin:0 0 12px}.hero p{margin:6px 0;font-size:16px;line-height:1.55}
.flash{background:#5a3510;border:1px solid #9d6728;padding:13px;border-radius:12px;margin-bottom:14px;font-weight:800}
.card{background:#1c1c1c;border:1px solid #555;border-radius:22px;padding:20px;margin:14px 0}
label{display:block;font-size:16px;font-weight:900;margin:15px 0 7px}
input{width:100%;padding:15px;border:1px solid #555;border-radius:14px;background:#242424;color:#fff;font-size:17px}
.person{border:1px solid #46505b;border-radius:17px;padding:15px;margin:14px 0;background:#171a1f}
.personHead{display:flex;justify-content:space-between;align-items:center}.personTitle{font-size:18px;font-weight:900}
.remove{border:0;background:#4a2427;color:#fff;border-radius:9px;padding:8px 10px;font-weight:800}
.add{width:100%;border:1px dashed #7e94a8;background:#172331;color:#fff;padding:14px;border-radius:13px;font-size:16px;font-weight:900;margin-top:10px}
.notice{font-size:13px;line-height:1.6;color:#cbd2db;background:#131820;border-radius:13px;padding:13px;margin-top:15px}
.agree{display:flex;gap:10px;align-items:flex-start;margin:15px 0;font-size:14px;line-height:1.45}.agree input{width:20px;height:20px;margin:0}
.submit{width:100%;border:0;background:#d9a936;color:#101010;padding:16px;border-radius:13px;font-size:17px;font-weight:900}
.small{font-size:13px;color:#aeb7c2;margin-top:8px}
</style>
</head>
<body>
<main>
<div class="hero">
<h1>⚓ 헌터호 온라인 승선명부</h1>
<p>예약 대표자 한 분이 <b>함께 타는 승선자 전원</b>을 한 번에 작성해 주세요.</p>
<p>출항지 : 거북섬 마리나</p>
</div>

{% with messages = get_flashed_messages() %}
{% if messages %}<div class="flash">{{messages[0]}}</div>{% endif %}
{% endwith %}

<form method="post" action="/passenger">
<div class="card">
<label>승선일</label>
<input type="date" name="boarding_date" value="{{prefill_date or ''}}" required>
<div class="small">예약확정 문자 링크로 들어오면 승선일이 자동으로 들어갑니다.</div>
</div>

<div class="card">
<div id="people"></div>
<button class="add" type="button" onclick="addPerson()">＋ 승선자 추가</button>
<div class="notice">입력 정보는 승선자 확인, 안전 운항 및 비상상황 대응을 위해 사용합니다. 승선 전 구명조끼 착용 및 선내 안전수칙을 확인하고 선장의 안전지시에 따라주세요.</div>
<label class="agree"><input type="checkbox" name="agree" value="yes" required><span>승선자 전원의 정보를 정확히 입력했으며 개인정보 수집·이용 및 안전수칙에 동의합니다.</span></label>
<button class="submit" type="submit">승선명부 한 번에 제출</button>
</div>
</form>
</main>

<template id="personTemplate">
<div class="person">
<div class="personHead"><div class="personTitle"></div><button class="remove" type="button" onclick="removePerson(this)">삭제</button></div>
<label>성명</label><input name="name[]" required>
<label>생년월일</label><input name="birth_date[]" inputmode="numeric" maxlength="8" placeholder="예: 19800101" required>
<label>연락처</label><input name="phone[]" inputmode="tel" placeholder="01012345678" required>
<label>비상연락처</label><input name="emergency_phone[]" inputmode="tel" placeholder="01012345678" required>
</div>
</template>

<script>
const people=document.getElementById('people');
const tpl=document.getElementById('personTemplate');
function renumber(){
  [...people.querySelectorAll('.person')].forEach((el,i)=>{
    el.querySelector('.personTitle').textContent=(i+1)+'번 승선자';
    el.querySelector('.remove').style.display=people.children.length===1?'none':'block';
  });
}
function addPerson(){people.appendChild(tpl.content.cloneNode(true));renumber();}
function removePerson(btn){if(people.children.length<=1)return;btn.closest('.person').remove();renumber();}
addPerson();
</script>
</body>
</html>
