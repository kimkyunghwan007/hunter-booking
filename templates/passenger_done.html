<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>승선명부 제출 완료</title><style>
body{margin:0;background:#0e131b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:600px;margin:auto;padding:35px 20px}.card{background:#fff;color:#172332;border-radius:22px;padding:30px 22px;text-align:center}
h1{font-size:25px;margin:0 0 15px}.count{font-size:20px;font-weight:900;color:#0b5f93}
a{display:block;margin-top:22px;background:#0b2945;color:#fff;text-decoration:none;padding:14px;border-radius:12px;font-weight:900}
</style></head><body><main><div class="card">
<h1>✅ 승선명부 제출 완료</h1><p><b>{{name}}</b>님 대표로 승선명부가 정상 접수되었습니다.</p>
{% if count %}<p class="count">총 {{count}}명 작성 완료</p>{% endif %}
<p>승선 당일 안전하게 모시겠습니다.</p><a href="/">헌터호 예약 홈페이지로</a>
</div></main></body></html>
